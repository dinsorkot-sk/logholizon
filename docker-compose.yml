services:
  core:
    build: .
    command: logholizon-core
    environment:
      CORE_HOST: 0.0.0.0
      CORE_PORT: 8787
      CORE_DATABASE_URL: sqlite:///data/core.db
      CORE_BACKUP_INTERVAL_HOURS: 24
      CORE_BACKUP_KEEP: 7
    volumes:
      - logholizon-data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped
    # Readiness (not just liveness): /ready verifies migrations, integrity,
    # WAL policy, and queue depth. node:22-slim has no curl; use node fetch.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build: .
    command: node /app/.output/server/index.mjs
    environment:
      NODE_ENV: production
      CORE_URL: http://core:8787
      NUXT_PORT: 3000
      NUXT_HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  logholizon-data: