name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p logholizon-core -p logholizon-cli --all-targets -- -D warnings
      - run: cargo test -p logholizon-core --lib -- --test-threads=1
      - run: cargo build -p logholizon-core -p logholizon-cli

  app:
    name: App (build, test, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/app run test
      - run: pnpm --dir packages/app run check
      - run: pnpm --dir packages/app run build
      - name: Upload Nuxt build
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build-${{ github.sha }}
          path: packages/app/.output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    needs: [rust, app]
    timeout-minutes: 30
    env:
      # Run against the production Nuxt server built by the `app` job instead
      # of a cold `nuxt dev` server: faster and no Vite dep-optimizer reloads.
      E2E_APP_MODE: preview
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Download Nuxt build
        uses: actions/download-artifact@v4
        with:
          name: nuxt-build-${{ github.sha }}
          path: packages/app/.output
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir packages/app exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir packages/app exec playwright install-deps chromium
      # Builds core + cli, then runs the Playwright suite (see root package.json).
      - run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            packages/app/test-results
            packages/app/playwright-report
          if-no-files-found: ignore
          retention-days: 14
  desktop:
    name: Desktop (Tauri shell and frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/app run build:desktop
      - run: pnpm --dir packages/desktop run test
      - run: pnpm --dir packages/desktop run check
      - name: Upload desktop frontend
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-${{ github.sha }}
          path: packages/app/.output/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
