name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --workspace --release
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/app run test
      - run: pnpm --dir packages/app run check
      - run: pnpm --dir packages/app run build
      - run: pnpm --dir packages/app run build:desktop
      - run: pnpm --dir packages/desktop run test
      - run: pnpm --dir packages/desktop run check
      - name: Stage release metadata
        run: |
          mkdir -p dist
          cp -R packages/app/.output dist/nuxt-output
          cp -R packages/app/.output/public dist/desktop-frontend
          cp target/release/logholizon-core dist/logholizon-core
          cp target/release/logholizon-cli dist/logholizon-cli
          tar -czf "dist/logholizon-${GITHUB_REF_NAME}.tar.gz" -C dist nuxt-output desktop-frontend logholizon-core logholizon-cli
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/logholizon-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
