[package]
name = "logholizon-desktop"
version = "0.1.0"
edition = "2021"

# Tauri shell: boots logholizon-core in-process on a loopback port and serves
# the Nuxt static SPA. Native WebKit linking (tauri crate) is enabled via the
# `ui` feature; workspace gates (fmt/clippy/test) run with `--no-default-features`
# so CI without system WebKit still passes. See README.md.
[lib]
name = "logholizon_desktop"
path = "src/lib.rs"

[[bin]]
name = "logholizon-desktop"
path = "src/main.rs"

[features]
default = []
ui = ["dep:tauri"]

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
logholizon-core = { path = "../../core" }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "=2.11.5", optional = true, features = ["tray-icon"] }
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["full"] }
